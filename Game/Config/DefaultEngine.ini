; Configuración base. Los perfiles Bajo/Medio/Alto/Ultra se afinan en la
; Fase 13 con mediciones reales (Docs/RENDIMIENTO.md); aquí solo van los
; valores por defecto del proyecto.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/ArpgGame.ArpgGameMode

[/Script/Engine.RendererSettings]
; Lumen para GI y reflejos; sombras virtuales; TSR como antialiasing/upscaler.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
; Cámara fija y lectura clara del combate: sin desenfoque de movimiento
; y con exposición fija (la ambientación oscura no debe "aclararse sola").
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AutoExposure=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12/SM6 por defecto; DX11/SM5 como alternativa para GPU antiguas (perfil Bajo).
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/NavigationSystem.RecastNavMesh]
; Las mazmorras se generan en tiempo de ejecución: la malla de navegación también.
RuntimeGeneration=Dynamic
